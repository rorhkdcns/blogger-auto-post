name: Blogger Stock Auto Post

on:
  schedule:
    - cron: '0 23 * * *' # 매일 한국 시간 오전 8시에 정기 실행 (UTC 23:00)
  workflow_dispatch: # Actions 탭에 수동 실행 버튼을 만들어 줍니다.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4 # v3에서 2026년 최신 규격인 v4로 업그레이드
      
      - name: Set up Python
        uses: actions/setup-python@v5 # v4에서 v5로 업그레이드
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai feedparser google-api-python-client

      - name: Run Auto Post Script
        env:
          # 💡 [핵심 수정] 파이썬 코드가 찾을 수 있도록 환경 변수 이름을 GEMINI_API_KEY로 변경합니다!
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          GEMINI_API_VERSION: 'v1'
        run: python auto_post.py
