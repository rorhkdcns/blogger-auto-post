name: Blogger Stock Auto Post

on:
  schedule:
    # ⏰ [시간 설정 최적화] 정각(0분) 대신 애매한 시간(34분)으로 설정하여 깃허브 스킵 현상 방지
    # 한국 시간 기준: 새벽 5시 34분, 오전 11시 34분, 오후 2시 34분, 오후 6시 34분 실행
    - cron: '34 20,2,5,9 * * *'
  workflow_dispatch: # Actions 탭에 수동 실행 버튼을 만들어 줍니다.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4 # v4 업그레이드 완료

      - name: Set up Python
        uses: actions/setup-python@v5 # v5 업그레이드 완료
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai feedparser google-api-python-client

      - name: Run Auto Post Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          # ❌ [삭제/주석 처리] 최신 google-genai SDK와 충돌하는 구형 버전을 강제 해제합니다.
          # GEMINI_API_VERSION: 'v1' 
        run: python auto_post.py
