name: 블로그 주식 자동 포스팅
on:
  schedule:
    # 깃허브 액션은 UTC 기준. 한국 시간(KST) = UTC + 9시간
    - cron: '0 1 * * *'   # UTC 01:00 = 한국 오전 10:00 (본 실행)
    - cron: '0 5 * * *'   # UTC 05:00 = 한국 오후 02:00 (실패 시 재시도용)

  # [Run workflow] 수동 클릭 버튼 유지
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Run Auto Post Script
      env:
        API_KEY: ${{ secrets.API_KEY }}
        TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
      run: python auto_post.py
